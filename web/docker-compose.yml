version: '3.8'

services:
  trmnl-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trmnl-eink-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
